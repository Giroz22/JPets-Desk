<div
  class="d-flex align-items-stretch justify-content-between gap-4 p-2 border border-1 rounded-pill"
  style="max-height: 4rem; min-width: 20rem"
  [style]="{
    'background-color': isHover ? '#f5f5f5' : ''
  }"
  (mouseenter)="isHover = true"
  (mouseleave)="isHover = false"
>
  <div
    class="rounded-circle overflow-hidden border border-2"
    style="width: 3rem; height: 3rem"
  >
    <img
      [src]="pet.image == '' ? 'imgs/ImgExample.png' : pet.image"
      alt=""
      class="w-100 h-100 object-fit-cover"
    />
  </div>

  <div class="flex-grow-1">
    <label class="row fw-semibold" for="">{{ pet.name }}</label>
    <label class="row" style="font-size: small; color: #696969" for="">{{
      pet.ownerName
    }}</label>
  </div>
  <button
    class="btn rounded-circle"
    style="width: 3rem; height: 3rem"
    [style]="{
      'background-color': isHover ? '#e0e0e0' : '#f5f5f5',
    }"
    (click)="showDetails(pet.id)"
  >
    <i class="bi bi-chevron-right"></i>
  </button>
</div>
