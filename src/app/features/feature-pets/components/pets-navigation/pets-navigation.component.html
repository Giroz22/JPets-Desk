@if (totalPages>1) {
<nav aria-label="Page navigation example">
  <ul class="pagination">
    <li class="page-item" [class]="actualPage === 1 ? 'disabled' : ''">
      <a class="page-link" (click)="previous()" aria-label="Previous">
        <span aria-hidden="true">&laquo;</span>
      </a>
    </li>

    @for (num of [].constructor(totalPages); track $index) {
    <li class="page-item">
      <a
        class="page-link"
        [class]="actualPage === $index + 1 ? 'active' : ''"
        (click)="setPage($index + 1)"
        >{{ $index + 1 }}</a
      >
    </li>
    }

    <li class="page-item" [class]="actualPage === totalPages ? 'disabled' : ''">
      <a class="page-link" (click)="next()" aria-label="Next">
        <span aria-hidden="true">&raquo;</span>
      </a>
    </li>
  </ul>
</nav>

}
