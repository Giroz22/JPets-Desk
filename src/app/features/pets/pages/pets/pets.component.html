<app-manager-layout>
  <div manager-info>Pet Manager</div>
  <div scroll-table-items>
    @for (pet of pets; track $index) {
    <app-row-data [action]="setPetSelected(pet.id)"
      ><div first-column>
        <span>{{ pet.name }}</span
        ><span>{{ pet.ownerName }}</span>
      </div>
      <div second-column>
        {{ pet.tel }}
      </div>
    </app-row-data>
    }
  </div>
  <app-manager-pet manager-detail />
</app-manager-layout>
