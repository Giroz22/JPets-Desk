<button class="row-data" (click)="action()">
  <app-avatar [src]="src" [alt]="alt" />
  <div class="info-detail">
    <ng-content select="[first-column]"></ng-content>
    <ng-content select="[second-column]"></ng-content>
    <app-circle-button [action]="action">
      <i icon class="bi bi-chevron-right"></i>
    </app-circle-button>
  </div>
</button>
