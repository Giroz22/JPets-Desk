<button class="row-data">
  <app-avatar [src]="pet.image" [alt]="'Imagen de ' + pet.name" [size]="size" />
  <div class="info-detail">
    <div class="primary-text">
      <span>{{ pet.name }}</span>
      <span>{{ pet.ownerName }}</span>
    </div>
    <span>{{ pet.tel }}</span>
    <app-circle-button />
  </div>
</button>
